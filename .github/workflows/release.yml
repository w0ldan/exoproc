name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure npm registry auth for npmjs
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build and publish packages to npm
        run: bun run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release on Monorepo Version Bump
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE_SHA}:package.json" 2>/dev/null; then
            BEFORE_SHA="HEAD~1"
          fi

          MONOREPO_VER=$(node -p "require('./package.json').version")
          PREV_MONOREPO_VER=$(git show "${BEFORE_SHA}:package.json" 2>/dev/null | node -e "const fs=require('fs'); try { console.log(JSON.parse(fs.readFileSync(0,'utf8')).version || ''); } catch { console.log(''); }")

          if [ "$MONOREPO_VER" != "$PREV_MONOREPO_VER" ]; then
            TAG="v$MONOREPO_VER"
            echo "Monorepo version changed ($PREV_MONOREPO_VER -> $MONOREPO_VER). Creating release $TAG..."
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" \
                --title "v$MONOREPO_VER" \
                --notes "Exoproc v$MONOREPO_VER release."
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
